name: Drift Detection

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run check
      - run: pnpm run broken-links

  report-failure:
    runs-on: ubuntu-latest
    needs: verify
    if: failure()
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const runUrl = context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId;
            const branch = context.ref.replace("refs/heads/", "");
            const title = "Drift detected on " + branch;
            const body = "The drift detection workflow failed on " + context.ref + ".\n\nChecks that ran: format:check (prettier), check (mintlify validate), broken-links.\n\nSee the failing run: " + runUrl + "\n\nThis issue was opened automatically by the workflow. Close it once the drift is fixed.";
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "drift-detection",
              per_page: 10,
            });
            const duplicate = existing.find((issue) => issue.title === title);
            if (duplicate) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: duplicate.number,
                body: "Drift detected again on " + branch + ": " + runUrl,
              });
              core.notice("Existing issue #" + duplicate.number + " already tracks this branch; appended a comment instead of creating a new issue.");
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ["drift-detection"],
              });
            }
