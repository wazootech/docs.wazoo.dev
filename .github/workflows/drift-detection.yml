name: Drift Detection

on:
  push:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # A closed pull request only closes drift issues; it has nothing to verify.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run check
      - run: pnpm run broken-links

  report-failure:
    runs-on: ubuntu-latest
    needs: verify
    if: failure()
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const runUrl = context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId;
            const branch = context.ref.replace("refs/heads/", "");
            const title = "Drift detected on " + branch;
            const body = "The drift detection workflow failed on " + context.ref + ".\n\nChecks that ran: format:check (prettier), check (mintlify validate), broken-links.\n\nSee the failing run: " + runUrl + "\n\nThis issue was opened automatically by the workflow. It closes automatically when the branch passes or its pull request merges.";
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "drift-detection",
              per_page: 100,
            });
            const duplicate = existing.find((issue) => issue.title === title);
            if (duplicate) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: duplicate.number,
                body: "Drift detected again on " + branch + ": " + runUrl,
              });
              core.notice("Existing issue #" + duplicate.number + " already tracks this branch; appended a comment instead of creating a new issue.");
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ["drift-detection"],
              });
            }

  close-resolved:
    runs-on: ubuntu-latest
    needs: verify
    # Runs when a branch passes, or when a same-repository pull request merges
    # (a merged branch is not pushed again, so a passing run would never come).
    if: >-
      !cancelled() && (needs.verify.result == 'success' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository))
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const runUrl = context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId;
            const pr = context.payload.pull_request;
            const branch = pr ? pr.head.ref : context.ref.replace("refs/heads/", "");
            const title = "Drift detected on " + branch;
            const reason = pr
              ? "Closing: pull request #" + pr.number + " for " + branch + " merged."
              : "Closing: " + branch + " passed the drift checks: " + runUrl;
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "drift-detection",
              per_page: 100,
            });
            for (const issue of existing.filter((item) => item.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: reason,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: "completed",
              });
              core.notice("Closed drift issue #" + issue.number + ".");
            }
