name: Drift Detection

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npm run format:check
      - run: npm run check
      - run: npm run broken-links

  report-failure:
    runs-on: ubuntu-latest
    needs: verify
    if: failure()
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const runUrl = context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId;
            const branch = context.ref.replace("refs/heads/", "");
            const title = "Drift detected on " + branch;
            const body = "The drift detection workflow failed on " + context.ref + ".\n\nChecks that ran: format:check (prettier), check (mintlify validate), broken-links.\n\nSee the failing run: " + runUrl + "\n\nThis issue was opened automatically by the workflow. Close it once the drift is fixed.";
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "drift-detection",
              per_page: 10,
            });
            const duplicate = existing.find((issue) => issue.title === title);
            if (duplicate) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: duplicate.number,
                body: "Drift detected again on " + branch + ": " + runUrl,
              });
              core.notice("Existing issue #" + duplicate.number + " already tracks this branch; appended a comment instead of creating a new issue.");
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ["drift-detection"],
              });
            }
