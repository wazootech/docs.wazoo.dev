name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npm run format:check
      - name: Reject legacy platform identity names
        run: |
          if grep -R -n -E --include='*.md' --include='*.mdx' --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.next '\buid\b|world_uid|worldUid|_uid\b' . || grep -n -E '\buid\b|world_uid|worldUid|_uid\b' docs.json openapi/*.json; then
            echo "Legacy platform identity found."
            exit 1
          fi
      - run: npm run check
      - run: npm run broken-links
