name: Nightly Validation

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npm run format:check
      - run: npm run check
      - run: npm run broken-links

  report-failure:
    runs-on: ubuntu-latest
    needs: verify
    if: failure()
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const runUrl = context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Nightly validation failed (" + context.ref.replace("refs/heads/", "") + ")",
              body: "The nightly docs validation workflow failed on " + context.ref + ".\n\nChecks that ran: format:check (prettier), check (mintlify validate), broken-links.\n\nSee the failing run: " + runUrl + "\n\nThis issue was opened automatically by the workflow. Close it once the drift is fixed."
            });
